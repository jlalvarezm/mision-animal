<script>
(function(){

{id:'forest',name:'El bosque',emoji:'🌳',setting:'Hay muchos árboles que sirven de alimento y refugio.',opts:[['🌲','Árboles',1,'Ser vivo: plantas'],['🐿️','Ardilla',1,'Ser vivo: animal'],['🪵','Suelo y rocas',1,'Medio físico'],['🐪','Camello',0,'Es característico de otros medios.'],['🪸','Coral marino',0,'Vive en el mar.'],['🐧','Pingüino',0,'No es propio de este bosque.']]},
{id:'prairie',name:'La pradera',emoji:'🦓',setting:'La hierba abunda y alimenta a muchos herbívoros.',opts:[['🌾','Hierba',1,'Ser vivo: planta productora'],['🦓','Cebra',1,'Ser vivo: herbívoro'],['🦁','León',1,'Ser vivo: carnívoro'],['🐻‍❄️','Oso polar',0,'Habita en regiones polares.'],['🦪','Mejillón',0,'Es propio de ambientes acuáticos.'],['🪸','Coral',0,'Se encuentra en el mar.']]},

{id:'polar',name:'Zona polar del norte',emoji:'❄️',setting:'Hay hielo, temperaturas muy bajas y pocos seres vivos.',opts:[['🧊','Hielo',1,'Medio físico'],['🐻‍❄️','Oso polar',1,'Ser vivo del Ártico'],['🦭','Foca',1,'Ser vivo: animal'],['🐪','Camello',0,'Es característico de zonas desérticas.'],['🌵','Cactus del desierto',0,'Es propio de otros medios.'],['🪸','Coral tropical',0,'Necesita aguas más cálidas.']]},
{id:'fresh',name:'El río de agua dulce',emoji:'🏞️',setting:'En estos ecosistemas viven peces, anfibios y plantas acuáticas.',opts:[['💧','Agua dulce',1,'Medio físico'],['🐟','Pez de río',1,'Ser vivo: pez'],['🐸','Rana',1,'Ser vivo: anfibio'],['🪸','Coral marino',0,'Es propio del mar.'],['🐪','Camello',0,'No es propio de un río.'],['🦁','León',0,'No es propio del medio acuático de un río.']]},
{id:'salt',name:'La costa marina',emoji:'🌊',setting:'Es un ecosistema de agua salada con muchos seres vivos.',opts:[['🌊','Agua salada',1,'Medio físico'],['🌿','Algas marinas',1,'Ser vivo: productor'],['🦪','Mejillón',1,'Ser vivo: animal'],['🐗','Jabalí',0,'Es un animal terrestre.'],['🌹','Rosal',0,'Es una planta terrestre.'],['🐸','Rana de charca',0,'Suele vivir cerca de agua dulce.']]}
];
const chains=[
{name:'La cadena del bosque',intro:'Construye la cadena alimentaria de una zona con hierba, conejos y linces.',sequence:[['🌿','Hierba'],['🐇','Conejo'],['🐈','Lince']],present:[2,0,1],lesson:'La hierba es productora, el conejo consumidor primario y el lince consumidor secundario.'},
{name:'El rosal del jardín',intro:'Sigue las relaciones que aparecen en el libro: del rosal al petirrojo.',sequence:[['🌹','Rosal'],['🐛','Pulgón'],['🐞','Mariquita'],['🐦','Petirrojo']],present:[2,3,0,1],lesson:'El rosal alimenta al pulgón; la mariquita se alimenta del pulgón y el petirrojo puede comer mariquitas.'},
{name:'La cadena del saltamontes',intro:'Ordena esta cadena como en las actividades de repaso de la unidad.',sequence:[['🌾','Hierba'],['🦗','Saltamontes'],['🐦','Petirrojo'],['🦅','Gavilán']],present:[3,1,0,2],lesson:'La flecha va desde el ser vivo que sirve de alimento hacia el que se lo come.'},
{name:'La pradera africana',intro:'Une un productor, un herbívoro y su depredador.',sequence:[['🌱','Hierba'],['🐃','Búfalo'],['🦁','León']],present:[1,2,0],lesson:'La hierba produce su alimento, el búfalo come plantas y el león es carnívoro.'}
];
const relations=[
{name:'Familia de gorilas',emoji:['🦍','🦍'],desc:'Los gorilas adultos cuidan de las crías y se ayudan a proteger al grupo.',group:'same',answer:'Grupo familiar',detail:'En un grupo familiar, animales de la misma especie colaboran en el cuidado y la defensa.'},
{name:'La colmena',emoji:['🐝','🐝'],desc:'Las abejas de una colmena se reparten tareas: criar, recoger alimentos y defender.',group:'same',answer:'Sociedad',detail:'En las sociedades se reparte el trabajo entre los individuos, como ocurre con las abejas.'},
{name:'Un banco de peces',emoji:['🐟','🐟'],desc:'Muchos peces nadan juntos para protegerse y desplazarse.',group:'same',answer:'Asociación',detail:'La asociación es una agrupación temporal para viajar, alimentarse o defenderse.'},
{name:'Hormigas y pulgones',emoji:['🐜','🐛'],desc:'Las hormigas obtienen un líquido dulce de los pulgones y los protegen de otros animales.',group:'diff',answer:'Mutualismo',detail:'Ambas especies se benefician: las hormigas obtienen alimento y los pulgones protección.'},
{name:'Pulga y perro',emoji:['🐕','🦟'],desc:'La pulga toma sangre del perro y provoca picor.',group:'diff',answer:'Parasitismo',detail:'Una especie sale beneficiada y la otra perjudicada: eso es parasitismo.'},
{name:'Rémora y tiburón',emoji:['🦈','🐟'],desc:'La rémora aprovecha restos de comida del tiburón sin molestarlo.',group:'diff',answer:'Comensalismo',detail:'Una especie se beneficia y la otra no resulta beneficiada ni perjudicada.'},
{name:'Plantas muy juntas',emoji:['🌱','🌿'],desc:'Varias plantas crecen muy juntas y necesitan la misma luz del sol.',group:'diff',answer:'Competencia',detail:'Las plantas compiten por la luz; ambas pueden verse perjudicadas al recibir menos recursos.'}

const flyerChoices=[
{title:'Elige el lema',opts:[['🌱 ¡Cuidemos la naturaleza!',1],['🗑️ ¡Dejemos basura en el campo!',0]]},
{title:'Elige la acción',opts:[['Recojamos los residuos y usemos las papeleras.',1],['Abandonemos los envoltorios donde queramos.',0]]},
{title:'Elige la imagen',opts:[['🌳🐦🌎',1],['🗑️🛢️💥',0]]}
];
let state={page:'home',index:0,score:0,hints:0,mistakes:0,selected:[],reward:0,finished:false};
let resumed=false;
try{const saved=JSON.parse(localStorage.getItem(STORAGE)||'null');if(saved&&Number.isInteger(saved.index)&&saved.index>=0&&saved.index<=20&&Number.isFinite(saved.score)){state={...state,...saved,page:'home',selected:[],mistakes:0,hints:0};resumed=saved.index>0&&!saved.finished}}catch(e){}

function top(){return `<div class="top"><div class="brand"><span class="mark">🌎</span><span>GUARDIANES DE LOS ECOSISTEMAS<br><small>Conocimiento del Medio · 3.º Primaria</small></span></div><button type="button" class="smallbtn" data-action="home">⌂ Inicio</button></div>`}
function render(content){APP.innerHTML=top()+`<main class="shell">${content}</main>`;}
function cover(){const hasProgress=resumed||state.index>0&&!state.finished;render(`<header class="hero"><span class="tiny">🌿 UNA AVENTURA PARA APRENDER JUGANDO</span><h1>Guardianes de los Ecosistemas</h1><p>¡La naturaleza necesita tu ayuda! Construye paisajes, completa cadenas alimentarias, investiga relaciones y protege el planeta.</p></header><section class="cover-illustration"><div class="scene" aria-label="Ilustración de un ecosistema"><span class="land-object object1">🌳</span><span class="land-object object2">🦊</span><span class="land-object object3">🌻</span><span class="land-object object4">🦋</span><span class="land-object object5">🌲</span></div></section><section class="welcome-content"><div class="chip-row"><span class="chip">20 retos</span><span class="chip">4 misiones</span><span class="chip">200 puntos</span><span class="chip">Sin preguntas tipo test</span></div>${b(hasProgress?'▶ Continuar partida':'▶ Empezar aventura','start')}${hasProgress?` ${b('↺ Nueva partida','reset','danger')}`:''}<p class="note">Selecciona tarjetas tocándolas o con el ratón. Puedes pedir pistas y repetir los retos sin perder la partida.</p></section>`)}
function missionIdx(idx){return missions.findIndex(m=>idx>=m.from&&idx<m.to)}
function curMission(){return missions[missionIdx(state.index)]}
function missionIntro(){const m=curMission();render(`<section class="level-hero"><div class="big">${m.emoji}</div><span class="eyebrow">MISIÓN ${missionIdx(state.index)+1} DE 4</span><h2>${m.name}</h2><p>${m.short}. ¡Supera los retos para conseguir tu insignia!</p>${b('¡Comenzar esta misión!','challenge')}<p class="note">Retos ${m.from+1} a ${m.to} de 20</p></section>`)}
function pageHeader(title,intro){return `<section class="lesson"><div class="lesson-top"><span class="progress-label">RETO ${state.index+1} / 20 · MISIÓN ${missionIdx(state.index)+1}</span><span class="score">⭐ ${state.score} puntos</span></div><div class="progress"><b style="width:${state.index/20*100}%"></b></div><div class="eyebrow">${esc(curMission().name)}</div><h2>${esc(title)}</h2><p class="intro">${esc(intro)}</p><div id="task" class="task-panel">`}
function pageFooter(){return `</div><div class="hint-row"><button type="button" class="smallbtn" data-action="hint">💡 Dame una pista</button><div class="feedback" id="feedback" role="status" aria-live="polite">Puedes intentarlo tantas veces como necesites.</div></div><footer>ITED · CEIP San Gregorio · Actividad de repaso para 3.º de Primaria</footer></section>`}
function startChallenge(){state.page='challenge';state.selected=[];state.hints=0;state.mistakes=0;drawChallenge()}
function drawChallenge(){if(state.index<6) drawHabitat();else if(state.index<10) drawChain();else if(state.index<17)drawRelation();else if(state.index<20)drawProtect();else endGame()}
function drawHabitat(){const h=habitats[state.index];let selected=state.selected;const selectedData=selected.map(i=>h.opts[i]);const cards=h.opts.map((o,i)=>`<button type="button" data-action="habitat" data-i="${i}" class="item-card ${selected.includes(i)?'picked':''}" ${selected.includes(i)?'disabled':''}><span class="em">${o[0]}</span><small>${esc(o[1])}</small></button>`).join('');const placed=selectedData.length?selectedData.map(o=>`<div class="inhabitant"><span class="em">${o[0]}</span><span>${esc(o[1])}</span></div>`).join(''):`<div class="empty-state">Añade 3 elementos adecuados</div>`;render(pageHeader(h.name,h.setting)+`<div class="task-header">🏞️ Construye el ecosistema: selecciona tres elementos correctos</div><div class="builder-scene ${h.id}">${placed}</div><div class="card-grid">${cards}</div><div class="explain">Una pista importante: un ecosistema contiene <b>seres vivos, medio físico y relaciones</b>.</div>`+pageFooter())}
function drawChain(){const c=chains[state.index-6];const correct=state.selected;const seq=c.sequence;const slots=seq.map((x,i)=>`${i?'<span class="arrow" aria-label="se alimenta de">→</span>':''}<div class="chain-slot ${i<correct.length?'filled':''}">${i<correct.length?`<span>${seq[i][0]}</span>${esc(seq[i][1])}`:`<span>?</span>Paso ${i+1}`}</div>`).join('');const cards=c.present.map(i=>i).filter(i=>!correct.includes(i)).map(i=>`<button type="button" data-action="chain" data-i="${i}" class="item-card"><span class="em">${seq[i][0]}</span><small>${esc(seq[i][1])}</small></button>`).join('');render(pageHeader(c.name,c.intro)+`<div class="task-header">🔗 Toca las tarjetas en el orden correcto: productor → consumidores</div><div class="chain-slots">${slots}</div><div class="card-grid">${cards}</div><div class="explain">Las flechas van del ser vivo que <b>sirve de alimento</b> al que <b>se lo come</b>.</div>`+pageFooter())}
function drawRelation(){const r=relations[state.index-10];const choices=(r.group==='same'?['Grupo familiar','Sociedad','Asociación']:['Mutualismo','Comensalismo','Parasitismo','Competencia']);render(pageHeader(r.name,'Observa la escena y coloca la etiqueta adecuada en el panel de investigación.')+`<div class="task-header">🔎 Laboratorio de relaciones entre seres vivos</div><div class="relationship-scene"><span class="buddy">${r.emoji[0]}</span><span class="buddy">${r.emoji[1]}</span></div><div class="scene-desc">${esc(r.desc)}</div><div class="relation-options">${choices.map(c=>`<button type="button" class="relation-option" data-action="relation" data-answer="${esc(c)}">🏷️ ${esc(c)}</button>`).join('')}</div>`+pageFooter())}
function drawProtect(){const p=state.index-17;
if(p===0){const done=state.selected;render(pageHeader('Operación: río limpio','Retira los cuatro residuos abandonados en el agua. Deja tranquilos a los seres vivos.')+`<div class="task-header">🧤 Toca solo los objetos que ensucian el río</div><div class="water-scene">${river.map((it,i)=>`<button type="button" class="water-item ${done.includes(i)?'saved':''}" data-action="river" data-i="${i}" style="left:${it[3]}%;top:${it[4]}%" aria-label="${esc(it[1])}" title="${esc(it[1])}">${it[0]}</button>`).join('')}</div><div class="water-counters">♻️ Residuos recogidos: ${done.length} / 4</div><div class="explain">La <b>basuraleza</b> es la basura abandonada en la naturaleza. Puede perjudicar a los ecosistemas.</div>`+pageFooter());return}
if(p===1){const chosen=state.selected;render(pageHeader('Plan de rescate del bosque','Elige tres buenas acciones para ayudar a conservar los ecosistemas.')+`<div class="task-header">🌳 Marca solo las acciones que protegen la naturaleza</div><div class="decision-grid">${goodActions.map((a,i)=>`<button type="button" class="decision ${chosen.includes(i)?'chosen':''}" ${chosen.includes(i)?'disabled':''} data-action="forest" data-i="${i}"><b>${a[0]}</b><span>${esc(a[1])}</span></button>`).join('')}</div><div class="explain">Acciones sencillas pueden proteger el medio físico y a los seres vivos que dependen de él.</div>`+pageFooter());return}
const phase=state.selected.length;const posterTitle=phase>=1?'¡Cuidemos la naturaleza!':'Tu lema aparecerá aquí';const posterAction=phase>=2?'Recojamos los residuos y usemos las papeleras.':'Escoge una acción para cuidar el entorno.';const posterEmoji=phase>=3?'🌳🐦🌎':'🌿';const options=flyerChoices[phase]||flyerChoices[2];render(pageHeader('Diseña la campaña final','Crea un cartel con lema, propuesta y una imagen para cuidar los ecosistemas.')+`<div class="task-header">🎨 Taller de comunicación: crea un pequeño cartel</div><div class="poster-preview"><div class="em">${posterEmoji}</div><h3>${posterTitle}</h3><p>${posterAction}</p></div><div class="poster-choice-title">${esc(options.title)}</div><div class="poster-options">${options.opts.map((o,i)=>`<button type="button" class="poster-opt" data-action="flyer" data-i="${i}">${esc(o[0])}</button>`).join('')}</div><div style="height:17px"></div>`+pageFooter())}
function feedback(message,type='warn'){const el=document.getElementById('feedback');if(el){el.textContent=message;el.className='feedback '+type}}
function wrong(message){state.mistakes++;feedback('🔍 '+message,'warn')}
function completed(note){const reward=(state.hints>0?6:state.mistakes>0?8:10);state.score+=reward;state.reward=reward;state.page='success';state.lastNote=note;state.index++;persist();render(`<section class="success"><div class="medal">🌟</div><div class="eyebrow">RETO SUPERADO</div><h2>¡Muy bien, guardián!</h2><p>${esc(note)}</p><div class="points">+${reward} puntos ⭐</div><div class="chip-row"><span class="chip">Completados: ${state.index}/20</span><span class="chip">Puntuación total: ${state.score}</span></div><div class="actions">${b(state.index===20?'🏆 Ver diploma':missions.some(m=>m.from===state.index)?'🏅 Siguiente misión':'→ Siguiente reto','next')}</div></section>`)}
function tapHabitat(i){const h=habitats[state.index],o=h.opts[i];if(!o)return;if(state.selected.includes(i))return;if(!o[2]){wrong('Esa pieza no encaja aquí. '+o[3]);return}state.selected.push(i);if(state.selected.length===3){completed('¡Ecosistema completado! Has elegido tres elementos adecuados para '+h.name.toLowerCase()+'. Un ecosistema incluye seres vivos, medio físico y sus relaciones.')}else{const n=state.selected.length;drawHabitat();feedback('✅ ¡Bien! '+o[3]+'. Llevas '+n+' de 3 elementos.','good')}}
function tapChain(i){const c=chains[state.index-6];if(state.selected.includes(i))return;let needed=state.selected.length;if(i!==needed){wrong(needed===0?'Empieza por un productor: una planta que fabrica su propio alimento.':'Busca el ser vivo que se alimenta del anterior.');return}state.selected.push(i);if(state.selected.length===c.sequence.length){completed(c.lesson)}else{drawChain();feedback('✅ ¡Correcto! Ya has colocado '+state.selected.length+' seres vivos en la cadena.','good')}}
function tapRelation(answer){const r=relations[state.index-10];if(answer===r.answer)completed(r.detail);else wrong('Fíjate en quién se beneficia, quién sale perjudicado y si los animales se reparten tareas o se agrupan.')}
function tapRiver(i){const it=river[i];if(!it)return;if(!it[2]){wrong('¡Ese es un ser vivo! Debemos protegerlo, no retirarlo del río.');return}if(state.selected.includes(i))return;state.selected.push(i);if(state.selected.length===4)completed('¡Río limpio! Has retirado los residuos sin molestar a los seres vivos. Cuidar el medio físico ayuda a todo el ecosistema.');else{drawProtect();feedback('♻️ ¡Bien! Residuos recogidos: '+state.selected.length+' de 4.','good')}}
function tapForest(i){const a=goodActions[i];if(!a)return;if(!a[2]){wrong('Esa acción perjudica al ecosistema. Piensa en cómo respetar a los seres vivos y su entorno.');return}if(state.selected.includes(i))return;state.selected.push(i);if(state.selected.length===3){completed('¡Protección en marcha! Recoger residuos, respetar los senderos y observar sin molestar ayudan a conservar la naturaleza.')}else{drawProtect();feedback('🌿 ¡Buena decisión! '+state.selected.length+' de 3 acciones responsables.','good')}}
function tapFlyer(i){const phase=state.selected.length;if(phase>=3)return;const option=flyerChoices[phase].opts[i];if(!option)return;if(!option[1]){wrong('Esa elección no ayuda a proteger los ecosistemas. Busca el mensaje que invita a cuidarlos.');return}state.selected.push(i);if(state.selected.length===3)completed('¡Campaña terminada! Has creado un cartel con lema, una acción concreta y una imagen para promover la protección de la naturaleza.');else{drawProtect();feedback('🎨 ¡Bien elegido! Completa el siguiente elemento del cartel.','good')}}
function hint(){if(state.page!=='challenge')return;state.hints++;let msg;if(state.index<6)msg='Piensa en el medio físico y en qué seres vivos podrían vivir allí. Elige tres elementos característicos.';else if(state.index<10)msg=state.selected.length===0?'La primera tarjeta siempre representa un productor, como una planta.':'Continúa con el animal que se come al anterior.';else if(state.index<17){const r=relations[state.index-10];msg=r.group==='same'?'¿Son parientes, se reparten tareas o solo se agrupan temporalmente?':'¿Las dos especies se benefician, una se perjudica, una no cambia o compiten?'}else if(state.index===17)msg='Retira objetos fabricados por personas, no animales ni plantas.';else if(state.index===18)msg='Elige acciones que no dañen el entorno ni molesten a los animales.';else msg='Un buen cartel invita a proteger la naturaleza con una acción positiva.';feedback('💡 Pista: '+msg,'good')}
function next(){if(state.index>=20){endGame();return}if(missions.some(m=>m.from===state.index))missionIntro();else startChallenge()}
function endGame(){state.finished=true;state.page='end';persist();render(`<section class="level-hero"><div class="big">🏆</div><span class="eyebrow">MISIÓN CUMPLIDA</span><h2>¡Guardián de los Ecosistemas!</h2><p>Has construido ecosistemas, conectado cadenas alimentarias, reconocido relaciones entre seres vivos y protegido la naturaleza. ¡Enhorabuena!</p><div class="end-score"><span>20 retos completados</span><span>⭐ ${state.score} de 200 puntos</span></div><div class="poster-preview"><div class="em">🌳🦋🌎</div><h3>DIPLOMA</h3><p>Guardiana o Guardián de los Ecosistemas</p><p>Conocimiento del Medio · 3.º Primaria</p></div><div class="actions no-print">${b('🔄 Jugar de nuevo','reset')}${b('🖨️ Imprimir diploma','print','secondary')}</div><p class="note">Has practicado los contenidos de la Unidad 4: La vida en los ecosistemas.</p></section>`)}
function reset(){if(!confirm('¿Quieres comenzar una nueva partida desde cero?'))return;state={page:'home',index:0,score:0,hints:0,mistakes:0,selected:[],reward:0,finished:false};resumed=false;persist();cover()}
APP.addEventListener('click',function(ev){const el=ev.target.closest('[data-action]');if(!el||el.disabled)return;const a=el.dataset.action;if(a==='start'){if(state.finished){endGame();return}if(state.index>=20){endGame();return}if(missions.some(m=>m.from===state.index))missionIntro();else startChallenge()}else if(a==='home'){cover()}else if(a==='reset'){reset()}else if(a==='challenge'){startChallenge()}else if(a==='next'){next()}else if(a==='hint'){hint()}else if(a==='habitat'){tapHabitat(Number(el.dataset.i))}else if(a==='chain'){tapChain(Number(el.dataset.i))}else if(a==='relation'){tapRelation(el.dataset.answer)}else if(a==='river'){tapRiver(Number(el.dataset.i))}else if(a==='forest'){tapForest(Number(el.dataset.i))}else if(a==='flyer'){tapFlyer(Number(el.dataset.i))}else if(a==='print'){window.print()}});
cover();
})();
</script>
</body>
</html>
