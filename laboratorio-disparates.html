const state={screen:'cover',n:0,part:0,phase:'detect',fixed:[],wrong:0,hints:0,notice:'',noticeType:'',frogOrder:[],step:0,scanActive:false,swim:false,finalStep:0};

function tone(kind){if(!sound)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;audioCtx=audioCtx||new C();const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type='sine';osc.frequency.value=kind==='good'?650:kind==='bad'?220:480;gain.gain.setValueAtTime(.035,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.13);osc.connect(gain);gain.connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+.15)}catch(e){}}

<div class="help-grid"><div class="help-card"><span class="symbol">👆</span><strong>1. Observa y toca</strong><p>Encuentra el disparate en el animal.</p></div><div class="help-card"><span class="symbol">🛠️</span><strong>2. Repara</strong><p>Elige una pieza o utiliza una máquina.</p></div><div class="help-card"><span class="symbol">🌟</span><strong>3. Aprende</strong><p>Descubre una explicación y gana puntos.</p></div></div>
<p>Hay hasta <strong>25 puntos por experimento</strong>. Puedes pedir pistas y repetir sin perder vidas. Tu progreso se guarda en este navegador siempre que lo permita.</p><div class="actionbar">${htmlButton('🏠 Portada','home','ghost')}${htmlButton('¡Entendido!','intro','green')}</div></div>`)}
function intro(){state.screen='intro';draw(`<div class="inside"><p class="micro">La historia</p><h2>⚡ ¡Un experimento ha salido mal!</h2><div class="story">${img('prof','portrait','Profesor Disparate')}<div class="speech"><strong>Profesor Disparate:</strong> ¡Oh, no! Mi máquina ha mezclado las características de los animales. ¡Mi laboratorio es un disparate!</div></div><div class="story">${img('robot','portrait','Chispa, el robot')}<div class="speech"><strong>Chispa:</strong> ¡Necesitamos tu ayuda! Detecta los errores, activa los reparadores y devuelve a cada animal su aspecto.</div></div><div class="actionbar">${htmlButton('🗺️ Entrar en el laboratorio','map','green')}</div></div>`)}
function map(){state.screen='map';const c=contiguous();const L=[['🌿','Animales descontrolados','Toca y repara un disparate','l1'],['🧪','Experimentos imposibles','Encuentra dos errores y escanea','l2'],['⚡','Grandes reparaciones','Usa máquinas y supera el reto final','l3']];draw(`<div class="inside"><p class="micro">Panel de control</p><h2>🗺️ Elige un experimento</h2><p class="subtitle">Los niveles se desbloquean a medida que reparas animales. Puedes repetir cualquiera ya completado.</p><div class="levels">${L.map((a,i)=>`<button class="level ${a[3]} ${c<i*4?'locked':''}" data-act="level" data-index="${i}" ${c<i*4?'disabled':''}><span class="level-icon">${a[0]}</span><strong>Nivel ${i+1}<br>${a[1]}</strong><span>${a[2]}<br><b>${Math.max(0,Math.min(4,c-i*4))}/4 completados</b></span></button>`).join('')}</div><h3 style="margin:25px 0 0">🔬 Experimentos</h3><div class="mission-grid">${Array.from({length:12},(_,i)=>`<button type="button" class="mission ${records[i]?'done':''} ${i===c?'now':''}" data-act="mission" data-index="${i}" ${i>c?'disabled':''}><span>${emojiOf(i)}</span><strong>${i+1}. ${titleOf(i)}</strong><small>${records[i]?'✅ '+records[i]+' puntos':i===c?'▶ Disponible':'🔒 Bloqueado'}</small></button>`).join('')}</div><div class="actionbar">${htmlButton('🏠 Volver','home','ghost')}${htmlButton(c<12?'▶ Continuar reparación':'🏆 Ver diploma',c<12?'continue':'diploma','green')}</div></div>`)}
function loadMission(n){if(n<0||n>11||n>contiguous())return;Object.assign(state,{screen:'task',n,part:0,phase:n<8?'detect':'special',fixed:[],wrong:0,hints:0,notice:'',noticeType:'',frogOrder:[],step:0,scanActive:false,swim:false,finalStep:0});render()}
function setNotice(s,type='bad'){state.notice=s;state.noticeType=type;announce(s)}
function render(){state.screen='task';if(state.n<8)return drawAnimal();if(state.n===8)return drawFrog();if(state.n===9)return drawDolphin();if(state.n===10)return drawFeeder();return drawFinal()}
function stageArt(m){let k=m.art;return k&&ASSETS[k]?img(k,'creature-image '+(k==='fish_wrong'?'image-fish':''),'Ilustración de '+m.name):`<span class="creature-emoji" aria-label="${escapeHtml(m.name)}">${m.emoji}</span>`}

if(state.phase==='repair'){controls=`<h3 class="section-title">🔧 Reparador de ${escapeHtml(cur.bad.toLowerCase())}</h3><p>Has encontrado <b>${escapeHtml(cur.bad.toLowerCase())}</b>. ¿Qué característica debes colocar en su lugar?</p><div class="choices">${cur.options.map(([sym,label])=>`<button class="choice" type="button" data-act="choose" data-value="${escapeHtml(label)}"><span class="symbol">${sym}</span><span class="label">${escapeHtml(label)}</span></button>`).join('')}</div>`}

draw(`<div class="inside">${progress()}<h2>🔬 ${escapeHtml(m.title)}</h2><p class="subtitle">${escapeHtml(m.intro)}</p><div class="lab-shell"><div class="lab-top"><span>🔬 CÁMARA DE EXPERIMENTOS</span><span>${state.fixed.length}/${m.parts.length} reparaciones</span></div><div class="lab-view"><div class="ring"></div><div class="creature-box ${repaired?'repaired':''}">${art}${state.phase==='detect'||state.phase==='repair'?hitbuttons(m):''}${state.scanActive?'<div class="scanner-overlay"><div class="scan-ray"></div></div>':''}</div><div class="animal-caption">${state.phase==='reveal'?'✅ Reparación completada':state.phase==='repair'?'🔧 Escoge la pieza adecuada':'👆 Toca el disparate'}</div></div></div>${info(state.phase==='reveal'?'prof':'robot',state.phase==='reveal'?'¡Así se hace! Ahora sabrás por qué hemos cambiado esa característica.':state.phase==='repair'?'¡Detectado! Usa las herramientas de reparación.':'Observa el animal. ¡Algo no encaja!')}${state.phase!=='reveal'?notice():''}<div class="toolbar">${controls}</div><div class="actionbar">${state.phase!=='reveal'?htmlButton('💡 Pedir una pista','hint','ghost'):''}${htmlButton('🗺️ Salir al mapa','map','ghost')}</div></div>`)}
function touchSpot(i){if(state.phase!=='detect'||state.fixed.includes(i))return;if(i<0||i>=ANIMALS[state.n].parts.length)return;state.part=i;state.phase='repair';state.scanActive=Boolean(ANIMALS[state.n].parts[i].scan);setNotice(i>=0?'¡Anomalía encontrada! Elige una reparación.':'','good');tone('good');render()}
function choose(v){if(state.phase!=='repair')return;const p=ANIMALS[state.n].parts[state.part];if(v===p.correct){state.fixed.push(state.part);state.phase='reveal';state.scanActive=false;setNotice('¡Reparación conseguida!','good');tone('good');render()}else{state.wrong++;setNotice('Esa pieza no es correcta. Piensa en el grupo al que pertenece el animal y prueba otra.','bad');tone('bad');render()}}
function nextPart(){if(state.phase!=='reveal')return;state.phase='detect';state.notice='';render()}
function hint(){state.hints++;let msg='';if(state.n<8){const m=ANIMALS[state.n];const p=m.parts[state.part]||m.parts.find((q,i)=>!state.fixed.includes(i));msg=state.phase==='repair'?p.hint:`Chispa: hay ${m.parts.length-state.fixed.length} característica(s) equivocada(s). Toca el símbolo que esté sobre el animal.`}else if(state.n===8){msg='Los huevos van primero. Después aparecen los renacuajos, que desarrollan patas antes de ser adultos.'}else if(state.n===9){msg='El delfín es un mamífero: necesita pulmones y salir a la superficie a respirar.'}else if(state.n===10){msg=FEEDER[state.step].correct}else{msg='Fíjate en cómo respira o en la cubierta del cuerpo de cada grupo.'}setNotice('💡 '+msg,'good');render()}
function drawFrog(){const order=[2,0,3,1];draw(`<div class="inside">${progress()}<h2>🐸 La rana que no crecía</h2>${info('prof','¡El ciclo vital se ha desordenado! Ordena las cuatro etapas de la metamorfosis, desde el principio hasta el final.')}
<div class="lab-shell"><div class="lab-top"><span>🧬 MÁQUINA DEL CICLO VITAL</span><span>${state.frogOrder.length}/4 etapas</span></div><div class="inside" style="position:relative"><div class="pieces">${order.map(i=>`<button class="piece" type="button" data-act="frog" data-index="${i}" ${state.frogOrder.includes(i)?'disabled':''}>${img(FROG[i][2],'','Imagen de '+FROG[i][1])}<strong>${FROG[i][1]}</strong></button>`).join('')}</div><div class="slots">${Array.from({length:4},(_,i)=>`<div class="slot ${state.frogOrder[i]!=null?'filled':''}">${state.frogOrder[i]!=null?`${i+1}. ${FROG[state.frogOrder[i]][1]}`:'Paso '+(i+1)}</div>`).join('')}</div></div></div>${notice()}${state.phase==='success'?`<div class="notice good">¡Excelente! Primero nacen renacuajos con cola y branquias. Durante la metamorfosis desarrollan patas y pulmones hasta convertirse en ranas adultas.</div><div class="actionbar">${htmlButton('⭐ Terminar experimento','complete','gold')}</div>`:`<div class="actionbar">${htmlButton('↶ Deshacer','undo','ghost',state.frogOrder.length?'':'disabled')}${htmlButton('💡 Pista','hint','ghost')}</div>`}</div>`)}
function pickFrog(i){if(state.phase==='success'||state.frogOrder.includes(i))return;const expected=state.frogOrder.length;if(i!==expected){state.wrong++;setNotice('Todavía no es esa etapa. Observa qué sucede antes en la vida de una rana.');tone('bad');render();return}state.frogOrder.push(i);setNotice('¡Bien! Has colocado la etapa '+state.frogOrder.length+'.','good');tone('good');if(state.frogOrder.length===4)state.phase='success';render()}
function drawDolphin(){const scan=state.step===0;draw(`<div class="inside">${progress()}<h2>🐬 El delfín sin aire</h2>${info('robot',scan?'El escáner ha confundido al delfín con un pez. Examina su respiración y selecciona la característica correcta.':'¡Pulmones restaurados! Ahora ayúdalo a alcanzar la superficie para respirar.')}
<div class="lab-shell"><div class="lab-top"><span>🌊 TANQUE DE OBSERVACIÓN</span><span>${scan?'🔬 Escáner respiratorio':'🫁 Respiración pulmonar'}</span></div><div class="inside"><div class="water ${state.swim?'surface':''}">${img('dolphin','','Delfín en el agua')}<span class="bubble-escape">💨✨</span></div></div></div>${notice()}${scan?`<h3 class="section-title" style="margin-top:16px">¿Qué debes poner en el escáner?</h3><div class="simulator">${[['🫧','Branquias'],['🫁','Pulmones'],['🌱','Hojas']].map(([ic,v])=>`<button class="sim-card" data-act="lungs" data-value="${v}"><span>${ic}</span><strong>${v}</strong></button>`).join('')}</div>`:`<div class="notice good">El delfín es un mamífero: respira aire con pulmones, aunque vive en el agua.</div><div class="actionbar">${htmlButton('⬆ Subir a la superficie','surface','blue')}</div>`}<div class="actionbar">${htmlButton('💡 Pista','hint','ghost')}</div></div>`)}
function lungs(v){if(state.step!==0)return;if(v==='Pulmones'){state.step=1;setNotice('¡Escáner corregido! Los delfines usan pulmones.','good');tone('good')}else{state.wrong++;setNotice('No es correcto. Recuerda a qué grupo pertenece el delfín.');tone('bad')}render()}
function surface(){if(state.step!==1)return;state.swim=true;setNotice('¡Ya puede respirar aire! Has salvado al delfín.','good');tone('good');render();setTimeout(()=>{if(state.n===9&&state.screen==='task')complete()},700)}
function drawFeeder(){const k=FEEDER[state.step];draw(`<div class="inside">${progress()}<h2>🐦 El ave sin hogar</h2>${info('prof','¡Vamos a montar un comedero con materiales reutilizados! Este es un pequeño simulador de cuidados, no una prueba de memoria.')}
<div class="lab-shell"><div class="lab-top"><span>🛠️ CENTRO DE CUIDADOS</span><span>Fase ${state.step+1} de 3</span></div><div class="lab-view" style="min-height:220px"><div class="ring"></div><div class="creature-box" style="height:200px"><span class="creature-emoji" style="font-size:120px">${['♻️','🌳','🐦'][state.step]}</span></div><div class="animal-caption">${state.step===0?'Construir':state.step===1?'Colocar':'Alimentar'}</div></div></div><div class="stage-progress">${FEEDER.map((a,i)=>`<span class="${i<state.step?'done':i===state.step?'active':''}">${i<state.step?'✓ ':''}Fase ${i+1}</span>`).join('')}</div><h3 class="section-title">${k.title}</h3><p>${k.help}</p><div class="simulator">${k.choices.map(([ic,v])=>`<button class="sim-card" data-act="feed" data-value="${escapeHtml(v)}"><span>${ic}</span><strong>${escapeHtml(v)}</strong></button>`).join('')}</div>${notice()}<div class="actionbar">${htmlButton('💡 Pista','hint','ghost')}</div></div>`)}
function feed(v){const it=FEEDER[state.step];if(v!==it.correct){state.wrong++;setNotice('Esa elección no resulta adecuada o segura. Intenta otra.');tone('bad');render();return}setNotice(it.fact,'good');tone('good');state.step++;if(state.step===3)return complete();render()}
function drawFinal(){const it=FINAL[state.finalStep];draw(`<div class="inside">${progress()}<h2>⚡ ¡Salvemos el laboratorio!</h2>${info('robot','¡Última misión! Repara un error de cada grupo de vertebrados para activar la máquina central.')}
<div class="stage-progress">${FINAL.map((x,i)=>`<span class="${i<state.finalStep?'done':i===state.finalStep?'active':''}">${i<state.finalStep?'✓ ':''}${x.group}</span>`).join('')}</div><div class="lab-shell"><div class="lab-top"><span>🧪 REPARADOR CENTRAL</span><span>${state.finalStep+1}/5 animales</span></div><div class="lab-view" style="min-height:230px"><div class="ring"></div><div class="creature-box" style="height:205px"><span class="creature-emoji" style="font-size:140px">${it.emoji}</span></div><div class="animal-caption">❌ ${it.fault}</div></div></div><h3 class="section-title" style="margin-top:15px">¿Qué reparación necesita?</h3><div class="simulator">${it.choices.map(([ic,v])=>`<button class="sim-card" type="button" data-act="finalfix" data-value="${escapeHtml(v)}"><span>${ic}</span><strong>${escapeHtml(v)}</strong></button>`).join('')}</div>${notice()}<div class="actionbar">${htmlButton('💡 Pista','hint','ghost')}</div></div>`)}
function finalFix(v){const it=FINAL[state.finalStep];if(v!==it.correct){state.wrong++;setNotice('¡Casi! Comprueba las características de ese grupo.');tone('bad');render();return}setNotice('¡Reparación conseguida! '+it.fact,'good');tone('good');state.finalStep++;if(state.finalStep===5)return complete();render()}
function complete(){const n=state.n;const score=scoreForMission();records[n]=Math.max(Number(records[n])||0,score);store();state.screen='result';const fact=n<8?ANIMALS[n].parts.map(p=>p.fact).join(' '):['La metamorfosis transforma a los renacuajos en ranas adultas.','Los delfines son mamíferos que respiran mediante pulmones.','Cuidar a las aves requiere alimento adecuado y un lugar seguro.','Los cinco grupos de vertebrados tienen rasgos diferentes.'][n-8];draw(`<div class="inside celebration">${progress()}<div class="medal">${n===11?'🏆':'🌟'}</div><h2>¡Experimento reparado!</h2><p class="subtitle">${titleOf(n)}</p><div class="score">+${score} puntos</div>${n===0?img('fish_good','result-image','Pez reparado'):`<div style="font-size:65px;margin:5px">${emojiOf(n)}</div>`}<div class="notice good"><strong>📚 Has aprendido:</strong><br>${escapeHtml(fact)}</div><div class="actionbar">${htmlButton('🗺️ Ver panel','map','ghost')}${htmlButton(n===11?'🏆 Ver diploma':n===3||n===7?'🏅 Recibir insignia':'➡ Siguiente experimento','next','gold')}</div></div>`)}
function next(){const n=state.n;if(n===3||n===7)return award();if(n===11)return diploma();loadMission(n+1)}
function award(){state.screen='award';const first=state.n===3;draw(`<div class="inside center"><div class="medal">${first?'🥉':'🥈'}</div><h2>¡Nivel superado!</h2><p class="subtitle">${first?'Insignia: Ayudante científico':'Insignia: Investigador animal'}</p>${info('prof',first?'¡Conoces las principales partes de los animales! Ahora llegan experimentos que necesitan el escáner.':'¡Has reparado animales con dos disparates! Las máquinas avanzadas están preparadas.')}
<div class="actionbar">${htmlButton('🗺️ Mapa','map','ghost')}${htmlButton('🚀 Siguiente nivel','nextlevel','green')}</div></div>`)}
function diploma(){state.screen='end';draw(`<div class="inside center"><div class="diploma"><div class="medal">🏆</div><h2>¡ENHORABUENA!</h2><p>El laboratorio vuelve a funcionar gracias a ti.</p><div class="group">🐱 🦅 🐢 🐸 🐟</div><h3>Maestro del Laboratorio</h3><p>Has superado los 12 experimentos de los vertebrados.</p><div class="score">⭐ ${points()} / 300</div><div class="award-stars">⭐⭐⭐</div><small>Conocimiento del Medio · 3.º de Primaria</small></div><div class="actionbar">${htmlButton('🖨️ Imprimir diploma','print','blue')}${htmlButton('🗺️ Mapa','map','ghost')}${htmlButton('↻ Jugar de nuevo','reset','green')}</div></div>`)}
function reset(){if(!confirm('¿Quieres borrar los puntos guardados y empezar desde cero?'))return;records={};store();start()}
$('app').addEventListener('click',e=>{const b=e.target.closest('button[data-act]');if(!b||b.disabled)return;const a=b.dataset.act;switch(a){case'home':start();break;case'help':help();break;case'intro':intro();break;case'map':map();break;case'continue':loadMission(Math.min(contiguous(),11));break;case'mission':loadMission(Number(b.dataset.index));break;case'level':{const i=Number(b.dataset.index);loadMission(Math.min(Math.max(contiguous(),4*i),i*4+3));break}case'spot':touchSpot(Number(b.dataset.index));break;case'choose':choose(b.dataset.value);break;case'nextpart':nextPart();break;case'hint':hint();break;case'frog':pickFrog(Number(b.dataset.index));break;case'undo':if(state.frogOrder.length){state.frogOrder.pop();setNotice('Has retirado la última etapa.','good');render()}break;case'feed':feed(b.dataset.value);break;case'finalfix':finalFix(b.dataset.value);break;case'lung':case'lungs':lungs(b.dataset.value);break;case'surface':surface();break;case'complete':complete();break;case'next':next();break;case'nextlevel':loadMission(state.n+1);break;case'diploma':diploma();break;case'print':print();break;case'reset':reset();break;case'sound':sound=!sound;store();tone('good');if(state.screen==='cover')start();else if(state.screen==='map')map();else if(state.screen==='task')render();else if(state.screen==='end')diploma();else if(state.screen==='help')help();else if(state.screen==='intro')intro();else if(state.screen==='award')award();else if(state.screen==='result')complete();break;}});
window.addEventListener('error',e=>{console.error('Juego error',e.message)});
start();
</script>
</body>
</html>
